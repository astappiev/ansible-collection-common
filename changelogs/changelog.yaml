---
ancestor: null
releases:
  1.2.0:
    release_date: '2025-12-30'
    changes:
      release_summary: Added bashrc, bashrc_aliases roles, improved sshd and hostname roles.
      minor_changes:
        - Added bashrc role to manage global bashrc and bashrc.d directory
        - Added bashrc_aliases role for common aliases and colored output
        - hostname role now supports colored prompt based on hostname color
        - sshd role now supports authorized_keys management for root and stricter configuration
        - users role refactored to remove per-user bash profile management
        - restic role fixed logic error in autorestic check
  1.1.0:
    release_date: '2025-12-23'
    changes:
      release_summary: Added backup management and database roles.
      major_changes:
        - Added restic role for automated backup management with restic and autorestic
        - Added mariadb role for MariaDB server installation and database management
        - Added redis role for Redis server installation
        - Added buildtools role for installing development tools
        - Added install_github_release module for downloading and installing binaries from GitHub releases
  1.0.0:
    release_date: '2025-12-23'
    changes:
      release_summary: Initial release with common system administration roles.
      major_changes:
        - Initial release of the astappiev.common collection
      minor_changes:
        - Added admintools role for installing common system administration tools
        - Added hostname role for configuring system hostname
        - Added sshd role for configuring SSH daemon with security best practices
        - Added timezone role for configuring system timezone
        - Added users role for managing system users and groups
