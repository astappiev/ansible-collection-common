---
ancestor: null
releases:
  1.5.0:
    release_date: '2026-02-12'
    changes:
      release_summary: Improved role configurations and added rootless Docker support.
      breaking_changes:
        - sshd role defaults simplified - complex logic for extracting root keys from `users_list` moved from defaults to tasks
      minor_changes:
        - docker role now supports rootless mode configuration with `docker_rootless` and `docker_root_service` variables
        - mariadb role added configuration support for `datadir` and `bind_address` settings
        - Minor fixes and improvements
  1.4.0:
    release_date: '2026-02-04'
    changes:
      release_summary: Added cron, docker, and nodejs roles.
      major_changes:
        - Added cron role for managing scheduled tasks
        - Added docker role with support for both distribution packages and docker-ce repository installation
        - Added nodejs role with support for both distribution packages and NodeSource repository installation
  1.3.0:
    release_date: '2026-02-03'
    changes:
      release_summary: Refactored package management, improved role defaults and check mode support.
      breaking_changes:
        - Removed admintools role - use the new packages role instead
        - users role now defaults to empty users_list instead of including ansible_user
        - hostname role now defaults hostname_reboot to false instead of true
      major_changes:
        - Added packages role for generic package installation across different package managers
      minor_changes:
        - sshd role now integrates with users_list to automatically extract root authorized keys
        - hostname role now ensures dbus service is enabled and running before setting hostname
        - users role SSH key filenames now use inventory_hostname_short for better readability
      bugfixes:
        - Fixed hostname bash prompt color function to use guard variable instead of self-removal
        - Added check_mode guard to mariadb service start task
        - Added check_mode false to hostname zsh detection task for proper check mode support
  1.2.0:
    release_date: '2025-12-30'
    changes:
      release_summary: Added bashrc, bashrc_aliases roles, improved sshd and hostname roles.
      minor_changes:
        - Added bashrc role to manage global bashrc and bashrc.d directory
        - Added bashrc_aliases role for common aliases and colored output
        - hostname role now supports colored prompt based on hostname color
        - sshd role now supports authorized_keys management for root and stricter configuration
        - users role refactored to remove per-user bash profile management
        - restic role fixed logic error in autorestic check
  1.1.0:
    release_date: '2025-12-23'
    changes:
      release_summary: Added backup management and database roles.
      major_changes:
        - Added restic role for automated backup management with restic and autorestic
        - Added mariadb role for MariaDB server installation and database management
        - Added redis role for Redis server installation
        - Added buildtools role for installing development tools
        - Added install_github_release module for downloading and installing binaries from GitHub releases
  1.0.0:
    release_date: '2025-12-23'
    changes:
      release_summary: Initial release with common system administration roles.
      major_changes:
        - Initial release of the astappiev.common collection
      minor_changes:
        - Added admintools role for installing common system administration tools
        - Added hostname role for configuring system hostname
        - Added sshd role for configuring SSH daemon with security best practices
        - Added timezone role for configuring system timezone
        - Added users role for managing system users and groups
