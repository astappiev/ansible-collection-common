---
- name: Install restic binary
  astappiev.common.install_github_release:
    repo: restic/restic
    state: "{{ restic_state }}"
    asset_regex: restic_.*\.bz2
    version_command: "{{ restic_binary_path }} version"
    move_rules:
      - src_regex: restic_.*
        dst: "{{ restic_binary_path }}"
        mode: '0755'

- name: Install autorestic binary
  astappiev.common.install_github_release:
    repo: cupcakearmy/autorestic
    state: "{{ autorestic_state }}"
    asset_regex: autorestic_.*\.bz2
    version_command: "{{ autorestic_binary_path }} --version"
    move_rules:
      - src_regex: autorestic_.*
        dst: "{{ autorestic_binary_path }}"
        mode: '0755'

- name: Create autorestic configuration
  ansible.builtin.template:
    src: autorestic.yml.j2
    dest: "{{ autorestic_config_path }}"
    mode: '0600'
    owner: root
    group: root
    # autorestic check may attempt to reach configured backends; on a host
    # without network access to the backend this validation will fail.
    validate: "{{ autorestic_binary_path }} check -c %s"
  when: autorestic_locations | length > 0 and autorestic_backends | length > 0
  no_log: true

- name: Add autorestic systemd timer
  ansible.builtin.include_role:
    name: systemd_timer
  vars:
    systemd_timer_name: "autorestic"
    systemd_timer_command: "{{ autorestic_binary_path }} --restic-bin {{ restic_binary_path }} -c {{ autorestic_config_path }} --ci cron"
    systemd_timer_on_calendar: "{{ autorestic_timer_on_calendar }}"
  when: autorestic_timer | bool
