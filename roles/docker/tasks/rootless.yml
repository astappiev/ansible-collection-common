---
- name: Enable lingering for rootless users
  ansible.builtin.command: >
    loginctl enable-linger {{ item }}
  args:
    creates: "/var/lib/systemd/linger/{{ item }}"
  loop: "{{ docker_users }}"

- name: Perform per-user rootless Docker setup
  ansible.builtin.include_tasks:
    file: rootless_unpriv.yml
    apply:
      become: true
      become_user: "{{ user }}"
  loop: "{{ docker_users }}"
  loop_control:
    label: "{{ user }}"
    loop_var: user
    extended: true
