---
- name: Remove old/conflicting Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: absent
    purge: true

- name: Remove Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    state: absent
  register: _docker_repo_removed

- name: Install Docker packages from system repository
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-cli
      - docker-buildx
      - docker-compose
    update_cache: "{{ _docker_repo_removed is changed }}"
    state: present
