---
- name: Ensure /etc/docker directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure root Docker daemon (daemon.json)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: >-
      {{ (docker_daemon_options | default({}))
      | combine({'ipv6': true, 'fixed-cidr-v6': docker_ipv6_default_subnet} if docker_ipv6 | bool else {})
      | to_nice_json }}
  notify: Restart docker
  when: docker_ipv6 | bool or (docker_daemon_options is defined and docker_daemon_options | length > 0)
