---
- name: Test if cron job entries have required fields
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name is string
      - item.job is defined
      - item.job is string
    quiet: true
    fail_msg: "Each cron job must have 'name' and 'job' fields defined as strings"
  loop: "{{ cron_jobs }}"
