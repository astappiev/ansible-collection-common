---
- name: Create directory {{ bashrc_dir }}
  ansible.builtin.file:
    path: "{{ bashrc_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check which rc files exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ bashrc_global_path }}"
    - "{{ bashrc_global_path_zsh }}"
  register: _bashrc_file_stats

- name: Enable bashrc.d scripts
  ansible.builtin.blockinfile:
    path: "{{ item.item }}"
    prepend_newline: true
    append_newline: true
    create: false
    marker: "# {mark} ANSIBLE MANAGED bashrc.d inclusion"
    block: |
      if [ -d {{ bashrc_dir }} ]; then
        for i in {{ bashrc_dir }}/*.sh; do
          if [ -r $i ]; then
            . $i
          fi
        done
        unset i
      fi
  loop: "{{ _bashrc_file_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists
