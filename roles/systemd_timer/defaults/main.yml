# Define systemd timer name, it will be used fir the service and timer files names.
# systemd_timer_name:

# The environment file to use in the service unit
# systemd_timer_envfile:

# The working directory to use in the service unit
# systemd_timer_workingdir:

# pre-command before command execution
# systemd_timer_precommand:

# which command or script to execute
# systemd_timer_command:

# under which user and group the timer_command is executed. Default: root
systemd_timer_user: root
systemd_timer_group: root

# "*-*-* *:*:*" for example: *-*-* *:*:00 -> every minute
# Day Of the week  Year-Month-Date  Hour:Minute:Second
# systemd_timer_on_calendar:

# Timer have a default accuracy of round about one minute. You can set the accuracy with this var.
systemd_timer_accuracy_sec: 15s

# Takes a boolean argument. If true, the time when the service unit was last triggered is stroed on disk.
# When the timer is activated, the service unit is triggered immediately if it would have been triggered
# at least once during the time when the timer was inactive. This is useful to catch up on missed runs
# of the service when the machine was off. Defaults to false.
# Note that this setting only has an effect on timers configured with OnCalendar=.
systemd_timer_persistent: false

# Relative time after the timer unit was last activated
# systemd_timer_on_active_sec:

# Relative time after the computer was booted
# systemd_timer_on_boot_sec:

# Relative time after systemd was started
# systemd_timer_on_startup_sec:

# Relative time after the service unit was last activated
# systemd_timer_on_unit_active_sec:

# Relative time after the service unit was last deactivated
# systemd_timer_on_unit_inactive_sec:
