---
- name: Loop over users_groups
  ansible.builtin.include_tasks:
    file: group.yml
  loop: "{{ users_groups }}"
  loop_control:
    label: "{{ group.name }}"
    loop_var: group
  when:
    - users_groups is defined
    - users_groups | length > 0

- name: Loop over users
  ansible.builtin.include_tasks:
    file: user.yml
  loop: "{{ users_list }}"
  loop_control:
    label: "{{ user.name }}"
    loop_var: user
  when:
    - users_list is defined
    - users_list | length > 0

- name: Ensure the /etc/sudoers.d directory is included
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    line: "@includedir /etc/sudoers.d"
    regexp: "^(@|#)includedir"
    validate: "visudo --check --file %s"
