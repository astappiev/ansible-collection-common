---
- name: Include assertions
  ansible.builtin.include_tasks: assert.yml

- name: Install openssh-server package
  ansible.builtin.package:
    name: openssh-server
    state: present

- name: Ensure sshd_config.d directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure sshd via drop-in
  ansible.builtin.template:
    src: 00-ansible.conf.j2
    dest: /etc/ssh/sshd_config.d/00-ansible.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: Ensure authorized keys are present for root user
  ansible.posix.authorized_key:
    user: root
    key: "{{ sshd_authorized_keys | join('\n') }}"
    state: present
    exclusive: "{{ sshd_remove_authorized_keys }}"
  when:
    - sshd_authorized_keys | length > 0
    - _sshd_manage_root_keys

- name: Enable and start ssh service
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
