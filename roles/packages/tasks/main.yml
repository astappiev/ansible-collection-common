---
- name: Install packages (apt)
  ansible.builtin.apt:
    name: "{{ packages_list }}"
    state: "{{ packages_state }}"
    update_cache: true
    cache_valid_time: 3600
  when:
    - packages_list | length > 0
    - ansible_pkg_mgr == 'apt'

- name: Install packages (generic)
  ansible.builtin.package:
    name: "{{ packages_list }}"
    state: "{{ packages_state }}"
  when:
    - packages_list | length > 0
    - ansible_pkg_mgr != 'apt'
