---
- name: Add NodeSource repository for Node.js
  ansible.builtin.deb822_repository:
    name: nodesource
    uris: "https://deb.nodesource.com/node_{{ nodejs_version }}"
    types: deb
    suites: nodistro
    components: main
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    state: present
  register: nodejs_repo
  when: ansible_facts['os_family'] == 'Debian'

- name: Add NodeSource repository for Red Hat based systems
  ansible.builtin.yum_repository:
    name: nodesource
    description: "Node.js Packages for Enterprise Linux {{ ansible_facts['distribution_major_version'] }} - $basearch"
    baseurl: "https://rpm.nodesource.com/pub_{{ nodejs_version }}/el/{{ ansible_facts['distribution_major_version'] }}/$basearch"
    gpgkey: https://rpm.nodesource.com/pub/el/NODESOURCE-GPG-SIGNING-KEY-EL
    gpgcheck: true
    enabled: true
    state: present
  register: nodejs_repo
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install Node.js from NodeSource
  ansible.builtin.package:
    name: nodejs
    update_cache: "{{ nodejs_repo is changed }}"
    state: present
