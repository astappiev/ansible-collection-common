---
- name: Validate nodejs_install_source
  ansible.builtin.assert:
    that:
      - nodejs_install_source is defined
      - nodejs_install_source in ["distro", "nodesource"]
    fail_msg: "nodejs_install_source must be either 'distro' or 'nodesource', got '{{ nodejs_install_source }}'"
    quiet: true

- name: Test if nodejs_version is a string
  ansible.builtin.assert:
    that:
      - nodejs_version is defined
      - nodejs_version is string
      - nodejs_version != ''
    quiet: true
    fail_msg: "nodejs_version must be a string"
  when: nodejs_install_source == "nodesource"

- name: Test if nodejs_corepack_enable is a list
  ansible.builtin.assert:
    that:
      - nodejs_corepack_enable is defined
      - nodejs_corepack_enable is iterable
    quiet: true
    fail_msg: "nodejs_corepack_enable must be a list"

- name: Test if nodejs_npm_global_packages is a list
  ansible.builtin.assert:
    that:
      - nodejs_npm_global_packages is defined
      - nodejs_npm_global_packages is iterable
    quiet: true
    fail_msg: "nodejs_npm_global_packages must be a list"
