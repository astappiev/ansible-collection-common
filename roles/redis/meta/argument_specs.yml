---
argument_specs:
  main:
    short_description: Install and configure Redis server
    options:
      redis_bind:
        type: str
        default: "127.0.0.1 -::1"
        description: >-
          Bind address(es) for the Redis server.
      redis_password:
        type: str
        required: true
        no_log: true
        description: >-
          Password for Redis authentication. Must be defined in inventory, group_vars, or
          host_vars, and at least 12 characters long (checked in tasks/assert.yml).
